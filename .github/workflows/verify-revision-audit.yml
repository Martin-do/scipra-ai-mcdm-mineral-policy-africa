name: Verify SCIPRA revision audit

on:
  pull_request:
    branches: [post-freeze-analysis]
    types: [opened, synchronize, reopened]
    paths:
      - 'code/analyze_stance_robustness.py'
      - 'code/audit_corrected_swdc_candidate.py'
      - 'data/revision_analysis/.trigger'
      - '.github/workflows/run-robustness-swdc-revision.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run static stance robustness audit
        run: python code/analyze_stance_robustness.py
      - name: Run corrected SWDC candidate audit
        run: python code/audit_corrected_swdc_candidate.py
      - name: Verify key invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/revision_analysis')
          s=json.loads((p/'stance_robustness_summary.json').read_text())
          w=json.loads((p/'corrected_swdc_candidate_summary.json').read_text())
          assert s['conservative_bounds']['pass1_maximum_pro_fraction_even_if_all_nonpass1_records_are_pro'] < 0.5
          assert w['original_structural_result']=='degenerate_common_scalar_cancels_exactly'
          assert w['candidate_properties_verified']['nontrivial_relative_reweighting_if_criterion_pressures_differ']
          print(json.dumps({'stance':s,'swdc':w},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SCIPRA_REVISION_AUDIT_VERIFICATION
          path: data/revision_analysis/
          retention-days: 30
