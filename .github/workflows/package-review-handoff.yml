name: Package SCIPRA external review handoff

on:
  push:
    branches:
      - dataset-reconstruction
    paths:
      - '.github/workflows/package-review-handoff.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dataset reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: dataset-reconstruction

      - name: Build review ZIP from committed handoff
        run: |
          cd data/reconstruction
          rm -f scipra_external_review_handoff.zip
          zip -qr scipra_external_review_handoff.zip review_handoff
          ls -lh scipra_external_review_handoff.zip

      - name: Publish ZIP to dataset branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reconstruction/scipra_external_review_handoff.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Package SCIPRA external review handoff ZIP'
            git pull --rebase origin dataset-reconstruction
            git push origin HEAD:dataset-reconstruction
          fi

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: scipra-external-review-handoff-zip
          path: data/reconstruction/scipra_external_review_handoff.zip
          retention-days: 30
