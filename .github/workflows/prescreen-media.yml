name: Pre-screen discovered media URLs

on:
  push:
    branches:
      - dataset-reconstruction
    paths:
      - 'data/reconstruction/prescreen_media_discovery.py'
      - 'data/reconstruction/discovery/media_discovery_urls.csv'
      - '.github/workflows/prescreen-media.yml'
  workflow_dispatch:

concurrency:
  group: scipra-media-prescreen
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prescreen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dataset branch
        uses: actions/checkout@v4
        with:
          ref: dataset-reconstruction
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pre-screen discovery universe
        run: python data/reconstruction/prescreen_media_discovery.py
      - name: Publish pre-screen audit and direct candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reconstruction/discovery/media_discovery_prescreen.csv data/reconstruction/discovery/media_discovery_prescreen_summary.json data/reconstruction/expanded_media_candidates_discovery_direct.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Record media discovery pre-screen'
            git pull --rebase origin dataset-reconstruction
            git push origin HEAD:dataset-reconstruction
          fi
