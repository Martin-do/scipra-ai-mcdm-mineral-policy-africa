# Explicitly triggered after row-level spot-check of the high-confidence evidence classes.
name: Apply media decision batch 01

on:
  push:
    branches:
      - dataset-reconstruction
    paths:
      - '.github/workflows/apply-media-decision-batch-01.yml'
      - 'data/reconstruction/apply_media_decision_batch_01.py'
      - 'data/reconstruction/low_signal_substantive_evidence.csv'
  workflow_dispatch:

concurrency:
  group: scipra-media-decision-batch-01
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  decide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: dataset-reconstruction

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write reviewed decision ledger batch 01
        run: python data/reconstruction/apply_media_decision_batch_01.py

      - name: Show decision summary
        run: cat data/reconstruction/media_substantive_decision_summary.json

      - name: Publish ledger and summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reconstruction/media_substantive_decision_ledger.csv data/reconstruction/media_substantive_decision_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record reviewed media substantive decisions batch 01'
            git pull --rebase origin dataset-reconstruction
            git push origin HEAD:dataset-reconstruction
          fi
