# Explicit reviewed substantive-decision batches for archive media.
name: Apply reviewed media decision batches

on:
  push:
    branches:
      - dataset-reconstruction
    paths:
      - '.github/workflows/apply-media-decision-batch-01.yml'
      - 'data/reconstruction/apply_media_decision_batch_01.py'
      - 'data/reconstruction/apply_media_decision_batch_02.py'
      - 'data/reconstruction/apply_media_decision_batch_03_expand_690.py'
      - 'data/reconstruction/apply_media_decision_batch_04.py'
      - 'data/reconstruction/apply_media_decision_batch_05.py'
      - 'data/reconstruction/apply_media_decision_batch_06.py'
      - 'data/reconstruction/build_media_pending_review_queue.py'
      - 'data/reconstruction/low_signal_substantive_evidence.csv'
      - 'data/reconstruction/media_targeted_substantive_evidence.csv'
  workflow_dispatch:

concurrency:
  group: scipra-media-decision-batches
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  decide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: dataset-reconstruction

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild reviewed decision ledger batch 01
        run: python data/reconstruction/apply_media_decision_batch_01.py

      - name: Apply explicit reviewed decision batch 02
        run: python data/reconstruction/apply_media_decision_batch_02.py

      - name: Expand to all 690 with conservative decision batch 03
        run: python data/reconstruction/apply_media_decision_batch_03_expand_690.py

      - name: Apply source-specific reviewed decision batch 04
        run: python data/reconstruction/apply_media_decision_batch_04.py

      - name: Apply explicit residual reviewed decision batch 05
        run: python data/reconstruction/apply_media_decision_batch_05.py

      - name: Resolve final title-trigger records with batch 06
        run: python data/reconstruction/apply_media_decision_batch_06.py

      - name: Build pending-only review queue
        run: python data/reconstruction/build_media_pending_review_queue.py

      - name: Show cumulative decision and pending summaries
        run: |
          cat data/reconstruction/media_substantive_decision_summary.json
          cat data/reconstruction/media_pending_substantive_review_summary.json

      - name: Publish ledger, summary and pending queue
        run: |
          git config user.name 'github-actions[bot]]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reconstruction/media_substantive_decision_ledger.csv data/reconstruction/media_substantive_decision_summary.json data/reconstruction/media_pending_substantive_review.csv data/reconstruction/media_pending_substantive_review_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish completed title-trigger media substantive decisions'
            git pull --rebase origin dataset-reconstruction
            git push origin HEAD:dataset-reconstruction
          fi
