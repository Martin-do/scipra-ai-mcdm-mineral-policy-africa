name: Rebuild SCIPRA frozen corpus audit handoff

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: dataset-reconstruction

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild and validate frozen handoff
        run: python data/reconstruction/build_frozen_review_handoff.py

      - name: Show handoff summary
        run: cat data/reconstruction/review_handoff/HANDOFF_SUMMARY.json

      - name: Upload frozen handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: scipra-frozen-corpus-audit-handoff
          path: |
            data/reconstruction/review_handoff/
            data/reconstruction/scipra_corpus_freeze_handoff.zip
          retention-days: 30
