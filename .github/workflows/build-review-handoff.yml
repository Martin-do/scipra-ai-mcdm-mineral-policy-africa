name: Build SCIPRA external review handoff

on:
  push:
    branches:
      - dataset-reconstruction
    paths:
      - '.github/workflows/build-review-handoff.yml'
      - 'data/reconstruction/build_review_handoff.py'
  workflow_dispatch:

concurrency:
  group: scipra-review-handoff
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout dataset branch
        uses: actions/checkout@v4
        with:
          ref: dataset-reconstruction

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install acquisition and QC dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr zip
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf trafilatura cryptography pymupdf pytesseract pillow scikit-learn==1.4.2

      - name: Run screened-only acquisition snapshot
        env:
          SCIPRA_EXCLUDE_DISCOVERY_DIRECT: '1'
        run: python data/reconstruction/acquire_corpus_v4.py

      - name: Run screened-only corpus QC
        run: python data/reconstruction/qc_corpus.py

      - name: Build reviewer handoff directory
        run: python data/reconstruction/build_review_handoff.py

      - name: Add latest full acquisition audit and reviewer note
        run: |
          mkdir -p data/reconstruction/review_handoff/latest_full_acquisition_audit
          cp data/reconstruction/acquisition_summary_latest.json data/reconstruction/review_handoff/latest_full_acquisition_audit/ 2>/dev/null || true
          cp data/reconstruction/acquisition_status_latest.csv data/reconstruction/review_handoff/latest_full_acquisition_audit/ 2>/dev/null || true
          if [ -d data/reconstruction/qc ]; then
            rm -rf data/reconstruction/review_handoff/latest_full_acquisition_audit/qc
            cp -r data/reconstruction/qc data/reconstruction/review_handoff/latest_full_acquisition_audit/qc
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path('data/reconstruction')
          latest = base / 'acquisition_summary_latest.json'
          data = json.loads(latest.read_text(encoding='utf-8')) if latest.exists() else {}
          status = data.get('status_counts', {})
          note = f'''# Latest full acquisition audit — read before review

This subfolder is deliberately separate from the screened external-review corpus snapshot.

The screened handoff in the parent folder is the current preliminary corpus for substantive review. The files here record the later, broader acquisition pass, which includes archive-discovered candidates that have not all been accepted as corpus members.

Latest recorded acquisition audit:

- Historical seed benchmark: **{data.get('historical_seed_benchmark', 87)}**
- Eligible expansion candidates encountered: **{data.get('eligible_expansion_candidates', 'n/a')}**
- Candidates processed: **{data.get('processed_candidates', 'n/a')}**
- Successfully acquired/extracted: **{status.get('acquired_extracted', 'n/a')}**
- Acquired with low text: **{status.get('acquired_low_text', 'n/a')}**
- Acquired with no text: **{status.get('acquired_no_text', 'n/a')}**
- Failed acquisitions: **{status.get('failed', 'n/a')}**
- Total extracted words: **{data.get('total_text_words', 'n/a')}**

**Important:** these counts are acquisition/QC counts, not a final corpus size. Do not treat all processed or extracted candidates as included documents. Corpus freeze still requires substantive eligibility review, duplicate resolution, acquisition/text-quality checks, final inclusion/exclusion decisions, and a versioned/hash-locked manifest before annotation or modelling.
'''
          (base / 'review_handoff' / 'latest_full_acquisition_audit' / 'README.md').write_text(note, encoding='utf-8')
          PY

      - name: Build downloadable ZIP
        run: |
          rm -f data/reconstruction/scipra_external_review_handoff.zip
          cd data/reconstruction
          zip -qr scipra_external_review_handoff.zip review_handoff

      - name: Publish reviewer handoff to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reconstruction/review_handoff data/reconstruction/scipra_external_review_handoff.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Publish screened corpus external review handoff ZIP'
            git pull --rebase origin dataset-reconstruction
            git push origin HEAD:dataset-reconstruction
          fi

      - name: Upload metadata review artifact
        uses: actions/upload-artifact@v4
        with:
          name: scipra-external-review-handoff
          path: |
            data/reconstruction/review_handoff/
            data/reconstruction/scipra_external_review_handoff.zip
          retention-days: 30
