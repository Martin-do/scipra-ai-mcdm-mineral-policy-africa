name: Finalize archive media republications

on:
  push:
    branches:
      - dataset-reconstruction
    paths:
      - '.github/workflows/finalize-archive-media-pairs.yml'
      - 'data/reconstruction/finalize_archive_media_quality_and_pairs.py'
      - 'data/reconstruction/archive_media_same_title_year_similarity_audit.csv'
      - 'data/reconstruction/archive_media_quality_recovery_audit.csv'
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/finalize-archive-media-pairs.yml'
      - 'data/reconstruction/finalize_archive_media_quality_and_pairs.py'
      - 'data/reconstruction/archive_media_same_title_year_similarity_audit.csv'
      - 'data/reconstruction/archive_media_quality_recovery_audit.csv'
  workflow_dispatch:

concurrency:
  group: scipra-finalize-archive-media-pairs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: dataset-reconstruction

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Finalize quality and republication decisions
        run: python data/reconstruction/finalize_archive_media_quality_and_pairs.py

      - name: Show final pair-review summary
        run: cat data/reconstruction/archive_media_post_titlepair_summary.json

      - name: Publish final pair and quality review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reconstruction/archive_media_quality_review_decisions.csv data/reconstruction/archive_media_same_title_year_decisions.csv data/reconstruction/archive_media_post_titlepair_manifest.csv data/reconstruction/archive_media_post_titlepair_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish archive media republication and quality review'
            git pull --rebase origin dataset-reconstruction
            git push origin HEAD:dataset-reconstruction
          fi
