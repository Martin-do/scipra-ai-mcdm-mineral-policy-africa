name: Run reconstructed corpus acquisition

# Temporary manual trigger retained only as a fallback. The authoritative
# acquisition workflow now lives on dataset-reconstruction and is triggered by
# changes to the reconstruction inputs. Keeping this workflow off PR synchronize
# prevents it from cancelling the branch-native run through the shared
# concurrency group.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Use .github/workflows/acquire-corpus.yml on dataset-reconstruction for acquisition/QC."
