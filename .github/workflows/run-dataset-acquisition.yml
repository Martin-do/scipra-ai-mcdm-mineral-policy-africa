name: Run reconstructed corpus acquisition

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-dataset-acquisition.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout dataset reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: dataset-reconstruction

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install acquisition dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf trafilatura cryptography

      - name: Acquire and extract candidate corpus
        run: python data/reconstruction/acquire_corpus_v2.py

      - name: Publish acquisition status to dataset branch
        if: always()
        run: |
          if [ -f acquisition_output/acquisition_status.csv ]; then
            cp acquisition_output/acquisition_status.csv data/reconstruction/acquisition_status_latest.csv
          fi
          if [ -f acquisition_output/summary.json ]; then
            cp acquisition_output/summary.json data/reconstruction/acquisition_summary_latest.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reconstruction/acquisition_status_latest.csv data/reconstruction/acquisition_summary_latest.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record latest corpus acquisition audit'
            git push origin HEAD:dataset-reconstruction
          fi

      - name: Upload acquisition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scipra-corpus-acquisition
          path: acquisition_output/
          if-no-files-found: warn
          retention-days: 30
