name: Verify SCIPRA frozen reconstructed corpus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: dataset-reconstruction

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-run deterministic freeze assertions
        run: python data/reconstruction/finalize_textwide_near_duplicate_review.py

      - name: Show verified freeze summary and hashes
        run: |
          cat data/reconstruction/corpus_freeze_summary.json
          echo
          cat data/reconstruction/corpus_freeze_hashes.json
