# Triggered after first creation so GitHub Actions observes the workflow on the branch.
name: Audit SCIPRA cross-phase deduplication

on:
  push:
    branches:
      - dataset-reconstruction
    paths:
      - '.github/workflows/audit-cross-phase-dedup.yml'
      - 'data/reconstruction/build_cross_phase_dedup_audit.py'
      - 'data/reconstruction/archive_media_post_titlepair_manifest.csv'
      - 'data/reconstruction/archive_media_quality_review_decisions.csv'
      - 'data/reconstruction/review_handoff/screened_qc_preliminary_unique_text_manifest.csv'
  workflow_dispatch:

concurrency:
  group: scipra-cross-phase-dedup
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: dataset-reconstruction

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build conservative cross-phase audit
        run: python data/reconstruction/build_cross_phase_dedup_audit.py

      - name: Show cross-phase summary
        run: cat data/reconstruction/cross_phase_dedup_summary.json

      - name: Publish cross-phase audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reconstruction/cross_phase_match_audit.csv data/reconstruction/cross_phase_safe_duplicate_decisions.csv data/reconstruction/cross_phase_same_title_review.csv data/reconstruction/cross_phase_hash_collision_review.csv data/reconstruction/cross_phase_preliminary_combined_manifest.csv data/reconstruction/cross_phase_dedup_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish SCIPRA cross-phase duplicate audit'
            git pull --rebase origin dataset-reconstruction
            git push origin HEAD:dataset-reconstruction
          fi
