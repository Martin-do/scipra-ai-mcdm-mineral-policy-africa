# Secondary archive screening is complete (1,062/1,062 records processed).
# Keep this workflow available for deliberate reproducibility reruns only; do not
# re-fetch the entire secondary archive on every branch/PR update.
name: Screen secondary archive media

on:
  workflow_dispatch:

concurrency:
  group: scipra-secondary-archive-media-screen
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: dataset-reconstruction

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight extraction dependencies
        run: pip install requests beautifulsoup4 trafilatura

      - name: Fetch and derive evidence for 1,062 secondary records
        run: python data/reconstruction/screen_secondary_archive_media.py

      - name: Show secondary evidence summary
        run: cat data/reconstruction/secondary_media_targeted_evidence_summary.json

      - name: Publish metadata evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reconstruction/secondary_media_targeted_evidence.csv data/reconstruction/secondary_media_targeted_evidence_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record targeted evidence for secondary archive media'
            git pull --rebase origin dataset-reconstruction
            git push origin HEAD:dataset-reconstruction
          fi
