name: Verify PR3 semantic sensitivity audit

on:
  pull_request:
    branches: [post-freeze-analysis]
    types: [opened, synchronize, reopened]
    paths:
      - 'code/audit_criterion_semantic_sensitivity.py'
      - 'data/revision_analysis/.trigger'
      - '.github/workflows/run-robustness-swdc-revision.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests trafilatura beautifulsoup4 pypdf pymupdf
      - name: Run post-hoc semantic sensitivity audit
        run: python code/audit_criterion_semantic_sensitivity.py
      - name: Assert semantic sensitivity boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/revision_analysis/criterion_semantic_sensitivity_summary.json')
          s=json.loads(p.read_text())
          assert s['status']=='sensitivity_only_does_not_replace_preregistered_primary'
          assert s['fresh_recovered_total'] >= 770
          print(json.dumps(s, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SCIPRA_PR3_SEMANTIC_SENSITIVITY
          path: |
            data/revision_analysis/criterion_semantic_sensitivity_summary.json
            data/revision_analysis/criterion_semantic_sensitivity_matrix.csv
            data/revision_analysis/criterion_semantic_sensitivity_document_audit.csv
          retention-days: 30
